spring.application.name=database-modeling-lab
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USERNAME:orders_app}
spring.datasource.password=${DB_PASSWORD:orders_local}
spring.datasource.hikari.connection-timeout=2000
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
lab.failure-injection-enabled=${LAB_FAILURE_INJECTION_ENABLED:false}
