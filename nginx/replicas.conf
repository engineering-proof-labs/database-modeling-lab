worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    log_format race '$request_method $uri status=$status instance=$upstream_http_x_instance_id '
                    'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /dev/stdout race;

    upstream orders {
        server api-replica-a:8080 max_fails=0;
        server api-replica-b:8080 max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://orders;
            proxy_http_version 1.1;
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 6s;
        }
    }
}
