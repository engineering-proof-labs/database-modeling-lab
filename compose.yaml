x-api-clock: &api-clock
  LAB_CLOCK_INSTANT: "${LAB_CLOCK_INSTANT:-}"

x-api-common: &api-common
  build: .
  ports:
    - "127.0.0.1:18081:8080"

x-postgres-api-env: &postgres-api-env
  <<: *api-clock
  SPRING_PROFILES_ACTIVE: postgres
  DB_URL: jdbc:postgresql://postgres:5432/orders
  DB_USERNAME: orders_app
  DB_PASSWORD: orders_local

x-postgres-replica: &postgres-replica
  profiles: ["replicas"]
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
    interval: 2s
    timeout: 2s
    retries: 45

services:
  postgres:
    profiles: ["postgres", "replicas"]
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_app
      POSTGRES_PASSWORD: orders_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_app -d orders"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-postgres:
    <<: *api-common
    profiles: ["postgres"]
    environment:
      <<: *postgres-api-env
      LAB_FAILURE_INJECTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api-replica-a:
    <<: *postgres-replica
    environment:
      <<: *postgres-api-env
      LAB_INSTANCE_ID: orders-a

  api-replica-b:
    <<: *postgres-replica
    environment:
      <<: *postgres-api-env
      LAB_INSTANCE_ID: orders-b

  orders-proxy:
    profiles: ["replicas"]
    image: nginx:1.30.2-alpine
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./nginx/replicas.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-replica-a:
        condition: service_healthy
      api-replica-b:
        condition: service_healthy

  mongodb:
    profiles: ["mongodb"]
    image: mongo:8.0.38-noble
    environment:
      MONGO_INITDB_DATABASE: orders
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-lab-seed.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet mongodb://localhost:27017/admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  api-mongodb:
    <<: *api-common
    profiles: ["mongodb"]
    environment:
      <<: *api-clock
      SPRING_PROFILES_ACTIVE: mongodb
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: orders
      LAB_FAILURE_INJECTION_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy

  dynamodb-volume:
    profiles: ["dynamodb"]
    image: amazon/dynamodb-local:3.3.2
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/home/dynamodblocal/data"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  dynamodb:
    profiles: ["dynamodb"]
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-disableTelemetry", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    depends_on:
      dynamodb-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--aws-sigv4", "aws:amz:us-east-1:dynamodb", "--user", "local:local", "-H", "Content-Type: application/x-amz-json-1.0", "-H", "X-Amz-Target: DynamoDB_20120810.ListTables", "-d", "{}", "http://localhost:8000/"]
      interval: 2s
      timeout: 4s
      retries: 30

  api-dynamodb:
    <<: *api-common
    profiles: ["dynamodb"]
    environment:
      <<: *api-clock
      SPRING_PROFILES_ACTIVE: dynamodb
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      dynamodb:
        condition: service_healthy

  oracle:
    profiles: ["oracle", "ebr"]
    image: container-registry.oracle.com/database/free:23.26.4.0-lite
    stop_grace_period: 90s
    environment:
      ORACLE_PWD: OrdersAdminLocal42
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./scripts/oracle-create-user.sql:/opt/oracle/scripts/startup/01-create-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "printf 'whenever sqlerror exit failure\\nselect 1 from dual;\\nexit success\\n' | sqlplus -L -s orders_app/OrdersLocal42@//localhost:1521/FREEPDB1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 4m

  api-oracle:
    <<: *api-common
    profiles: ["oracle"]
    environment:
      <<: *api-clock
      SPRING_PROFILES_ACTIVE: oracle
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: orders_app
      DB_PASSWORD: OrdersLocal42
      LAB_FAILURE_INJECTION_ENABLED: "true"
    depends_on:
      oracle:
        condition: service_healthy

  api-ebr-v1:
    profiles: ["ebr"]
    build: .
    ports:
      - "127.0.0.1:18083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: oracle-ebr
      LAB_EBR_VERSION: V1
      JAVA_TOOL_OPTIONS: "-Doracle.jdbc.editionName=ORA$$BASE"
    depends_on:
      oracle:
        condition: service_healthy

  api-ebr-v2:
    profiles: ["ebr"]
    build: .
    ports:
      - "127.0.0.1:18084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: oracle-ebr
      LAB_EBR_VERSION: V2
      JAVA_TOOL_OPTIONS: "-Doracle.jdbc.editionName=ORDERS_V2"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  postgres-data:
  mongodb-data:
  dynamodb-data:
  oracle-data:
